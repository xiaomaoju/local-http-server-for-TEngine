services:
  tengine-server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "${PORT:-8082}:${PORT:-8082}"
      - "${HTTPS_PORT:-8182}:${HTTPS_PORT:-8182}"
    volumes:
      - tengine-data:/data
      # - /path/to/certs:/certs:ro
    env_file:
      - .env
    restart: unless-stopped

volumes:
  tengine-data:
