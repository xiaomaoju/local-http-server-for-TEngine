# ============================================================
#  宝塔面板 Nginx 限速规则
#
#  使用方法:
#  1. 宝塔面板 → 网站 → 你的站点 → 配置文件
#  2. 找到 server { 块的开头位置
#  3. 把下面的内容复制粘贴到 server { 的下一行
# ============================================================

    # --- 登录接口限速：防暴力破解（每 IP 每秒 1 次）---
    location = /api/auth/login {
        limit_req zone=tengine_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- 资源下载限速：防刷流量（每 IP 每秒 10 次，单连接 2MB/s）---
    location /res/ {
        limit_req zone=tengine_res burst=20 nodelay;
        limit_conn tengine_conn 5;
        limit_rate 2m;
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- WebSocket ---
    location /api/ws/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # --- 上传接口（允许大文件）---
    location ~* /api/projects/.*/upload {
        client_max_body_size 512m;
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

# ============================================================
#  下面这段要加到 nginx.conf 的 http { 块里（不是 server 块）
#  宝塔面板 → 软件商店 → Nginx → 配置修改
#  找到 http { 的下一行，粘贴进去
# ============================================================
