services:
  tengine-server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "${PORT:-8083}:${PORT:-8083}"
      - "${HTTPS_PORT:-8182}:${HTTPS_PORT:-8182}"
    volumes:
      - tengine-management-data:/data
      # - /path/to/certs:/certs:ro
    env_file:
      - .env
    environment:
      PORT: "${PORT:-8083}"
    restart: unless-stopped

volumes:
  tengine-management-data:
