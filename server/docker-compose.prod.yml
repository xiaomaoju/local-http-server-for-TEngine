services:
  tengine-server:
    image: tengine-server:latest
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "127.0.0.1:${PORT:-8083}:${PORT:-8083}"
    volumes:
      - tengine-management-data:/data
    env_file:
      - .env
    environment:
      PORT: "${PORT:-8083}"
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tengine-management-data:
