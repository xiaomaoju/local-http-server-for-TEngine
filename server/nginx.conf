# === 限速区域定义 ===
# 登录接口：每 IP 每秒 1 次（防暴力破解）
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;
# API 接口：每 IP 每秒 30 次
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
# 资源下载：每 IP 每秒 10 次（防刷流量）
limit_req_zone $binary_remote_addr zone=res_limit:10m rate=10r/s;
# 每 IP 最大并发连接数
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name _;

    # --- 全局安全头 ---
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # --- 全局连接限制：每 IP 最多 20 个并发 ---
    limit_conn conn_limit 20;

    # --- 登录接口：严格限速，防暴力破解 ---
    location = /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://tengine-server:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- 资源下载：限速 + 限带宽，防恶意刷流量 ---
    location /res/ {
        limit_req zone=res_limit burst=20 nodelay;
        limit_conn conn_limit 5;
        limit_rate 2m;

        proxy_pass http://tengine-server:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- WebSocket ---
    location /api/ws/ {
        limit_conn conn_limit 3;
        proxy_pass http://tengine-server:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # --- 其他 API ---
    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://tengine-server:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 512m;
    }

    # --- 管理后台页面 ---
    location / {
        proxy_pass http://tengine-server:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
