<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Native workspace fixture</title></head><body><div id="app"></div>
<script type="module">
import { createApp } from 'vue';
import Workspace from '/shared/Workspace.vue';
import { RemoteApi } from '/shared/api.ts';
import { installInputDefaults } from '/shared/inputDefaults.ts';
import '/shared/theme.css';
const api = new RemoteApi(window.fetch.bind(window), 'web', async (_url, onMessage) => {
  window.emitLog = log => onMessage(JSON.stringify(log));
  return {close() { window.emitLog = () => {}; }};
});
const app = createApp(Workspace, {api, native: window.nativeFixture});
app.mount('#app');
app.onUnmount(installInputDefaults());
</script>
<style>html,body,#app{height:100%;margin:0}</style></body></html>
